<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap contact form | Assignment 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bootstrap-page">
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">Assignment 4</a>
      <div class="nav-links">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a aria-current="page" href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="form-card">
      <p class="eyebrow">Part 2 · Bootstrap Forms</p>
      <h1>Contact form</h1>
      <p class="intro">This form uses Bootstrap classes and a two-column layout on larger screens.</p>
      <form action="#" method="get">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name" type="text" placeholder="Your name">
            <div class="form-text">Enter the name you use most often.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com">
            <div class="form-text">We can reply to this address.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="message">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message"></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Send message</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
