<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration form | Assignment 4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bootstrap-page">
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">Assignment 4</a>
      <div class="nav-links">
        <a href="index.html">Task 0</a>
        <a href="task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="task3.html">Task 3</a>
        <a aria-current="page" href="registration.html">Task 4</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="form-card">
      <p class="eyebrow">Part 3 · Advanced Form Project</p>
      <h1>Create an account</h1>
      <p class="intro">Fill in the form to register.</p>
      <form action="#" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="first-name">First name</label>
            <input class="form-control is-invalid" id="first-name" name="first-name" type="text" required maxlength="50" aria-describedby="first-name-feedback">
            <div class="invalid-feedback" id="first-name-feedback">First name is required.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-control" id="last-name" name="last-name" type="text" required maxlength="50">
          </div>
          <div class="col-12">
            <label class="form-label" for="email">Email</label>
            <input class="form-control is-valid" id="email" name="email" type="email" value="alex@example.com" required maxlength="100" aria-describedby="email-feedback">
            <div class="valid-feedback" id="email-feedback">Looks good!</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required minlength="8" maxlength="64" aria-describedby="password-help">
            <div class="form-text" id="password-help">Use at least 8 characters.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="confirm-password">Confirm password</label>
            <input class="form-control" id="confirm-password" name="confirm-password" type="password" required minlength="8">
            <div class="form-text">Enter your password again.</div>
          </div>
          <fieldset class="col-12">
            <legend class="form-label mb-2">Gender</legend>
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check">
                <input class="form-check-input" id="gender-woman" name="gender" type="radio" value="woman" required>
                <label class="form-check-label" for="gender-woman">Woman</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" id="gender-man" name="gender" type="radio" value="man" required>
                <label class="form-check-label" for="gender-man">Man</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" id="gender-other" name="gender" type="radio" value="other" required>
                <label class="form-check-label" for="gender-other">Prefer not to say</label>
              </div>
            </div>
          </fieldset>
          <fieldset class="col-12">
            <legend class="form-label mb-2">Hobbies</legend>
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check">
                <input class="form-check-input" id="hobby-reading" name="hobbies" type="checkbox" value="reading">
                <label class="form-check-label" for="hobby-reading">Reading</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" id="hobby-sports" name="hobbies" type="checkbox" value="sports">
                <label class="form-check-label" for="hobby-sports">Sports</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" id="hobby-music" name="hobbies" type="checkbox" value="music">
                <label class="form-check-label" for="hobby-music">Music</label>
              </div>
            </div>
          </fieldset>
          <div class="col-md-6">
            <label class="form-label" for="country">Country</label>
            <select class="form-select" id="country" name="country" required>
              <option value="" selected disabled>Choose a country</option>
              <option value="kazakhstan">Kazakhstan</option>
              <option value="kyrgyzstan">Kyrgyzstan</option>
              <option value="uzbekistan">Uzbekistan</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Register</button>
            <button class="btn btn-outline-light" type="reset">Reset</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
