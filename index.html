<!doctype html>

  <meta charset="utf-8">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">Assignment 4</a>

        <a aria-current="page" href="index.html">Task 0</a>

    </nav>
  </header>
  <main>
    <section class="form-card">
      <p class="eyebrow">Part 1 · Basic HTML Forms</p>
      <h1>Contact form</h1>
      <p class="intro">Send a message using the form below.</p>
      <form action="#" method="get">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Write your message"></textarea>
        </div>
        <button type="submit">Send message</button>
      </form>
      <p class="page-note">This is the basic form. Open Task 1 to see HTML5 validation.</p>
    </section>
  </main>
</body>
</html>
